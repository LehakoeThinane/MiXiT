# fly.toml app configuration file generated for mixit on 2026-06-10T20:19:13Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'mixit'
primary_region = 'jnb'

[build]

[env]
  # Fly's proxy sets this to the real client IP; rate limits and session IPs use it.
  CLIENT_IP_HEADER = 'fly-client-ip'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024

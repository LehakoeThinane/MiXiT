[build]
builder = "NIXPACKS"
buildCommand = "corepack enable && corepack pnpm install --frozen-lockfile && corepack pnpm run build"

[deploy]
startCommand = "node dist/server.js"
preDeployCommand = "corepack pnpm exec prisma migrate deploy"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

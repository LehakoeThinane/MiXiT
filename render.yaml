services:
  - type: keyvalue
    name: mixit-redis
    plan: free
    region: frankfurt
    ipAllowList: []

  - type: web
    name: mixit-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: backend
    autoDeploy: true
    healthCheckPath: /health
    buildCommand: corepack enable && corepack pnpm install --frozen-lockfile && corepack pnpm run prisma:generate && corepack pnpm run build && corepack pnpm exec prisma migrate deploy
    startCommand: corepack pnpm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: CORS_ORIGIN
        value: "*"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL
        value: 30d
      - key: DATABASE_URL
        fromDatabase:
          name: mixit-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: mixit-redis
          property: connectionString
      # PUBLIC_API_URL must match this service's real Render URL — set it
      # after the first deploy (Render assigns the URL at creation time).
      - key: PUBLIC_API_URL
        sync: false
      - key: PAYFAST_MODE
        value: sandbox
      - key: PAYFAST_MERCHANT_ID
        sync: false
      - key: PAYFAST_MERCHANT_KEY
        sync: false
      - key: PAYFAST_PASSPHRASE
        sync: false

databases:
  - name: mixit-db
    region: frankfurt
    plan: free
    databaseName: mixit
    user: mixit
    ipAllowList: []

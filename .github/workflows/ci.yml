name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Expo SDK 54 requires Node >= 20.19.4; the backend Docker image runs node:20.
  NODE_VERSION: '20'
  PNPM_VERSION: '9'

jobs:
  app:
    name: App (deps check + typecheck + lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Native module versions must match the Expo SDK or EAS builds fail/crash.
      - name: Check Expo SDK dependency versions
        run: pnpm exec expo install --check
        env:
          CI: '1'

      - name: Validate app config
        run: pnpm exec expo config --type public --json > /dev/null
        env:
          CI: '1'

      - name: Typecheck
        run: pnpm exec tsc --noEmit -p tsconfig.json

      - name: Lint
        run: pnpm run lint

  backend:
    name: Backend (tests + build + migrations)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mixit
          POSTGRES_PASSWORD: mixit
          POSTGRES_DB: mixit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mixit"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://mixit:mixit@localhost:5432/mixit
      DIRECT_URL: postgresql://mixit:mixit@localhost:5432/mixit
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: pnpm run test

      - name: Apply migrations to a fresh database
        run: pnpm exec prisma migrate deploy

      # Fails if schema.prisma has changes with no migration (or vice versa):
      # compares the freshly migrated database against the Prisma schema.
      - name: Check schema and migrations are in sync
        run: >-
          pnpm exec prisma migrate diff
          --from-url "$DATABASE_URL"
          --to-schema-datamodel prisma/schema.prisma
          --exit-code

      - name: Build (prisma generate + typecheck)
        run: pnpm run build

  backend-image:
    name: Backend Docker image (deploy build)
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4

      # Same Dockerfile Railway deploys (backend/railway.toml) — catches broken
      # production builds before they reach the host.
      - name: Build production image
        run: docker build -f backend/Dockerfile -t mixit-api:ci backend
